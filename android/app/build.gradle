plugins {
    id 'com.android.application'
    id 'kotlin-android'
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.samy.azkar2'
    // Play requires API 36.
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        // Required by flutter_local_notifications
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            storeFile file("azkar-keystore.jks") // Full path to your keystore
            storePassword "276217" // Keystore password
            keyAlias "upload"        // Alias name
            keyPassword "276217"   // Alias-specific password
        }
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.samy.azkar2"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 9
        versionName "1.7.0"
    }

    // 16 KB page size: keep native libs uncompressed so AGP aligns them to 16 KB.
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true     // Enable code shrinking (optional)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
